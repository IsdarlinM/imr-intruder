name: Cleanup branches

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const deleted = [];
            const failed = [];

            for (const branch of branches) {
              if (branch.name === 'main') continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                deleted.push(branch.name);
              } catch (error) {
                failed.push(`${branch.name}: ${error.message}`);
              }
            }

            core.info(`Deleted branches: ${deleted.join(', ') || '(none)'}`);
            core.info(`Failed branches: ${failed.join(', ') || '(none)'}`);

            await core.summary
              .addHeading('Branch cleanup')
              .addRaw(`Deleted: ${deleted.join(', ') || '(none)'}\n\n`)
              .addRaw(`Failed: ${failed.join(', ') || '(none)'}\n`)
              .write();

            if (failed.length > 0) {
              core.setFailed(`Could not delete ${failed.length} branch(es).`);
            }
