[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-intruder"
version = "1.4.5"
description = "Professional multimode HTTP request, response intelligence, and authorized web testing toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "imr"}]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "websockets>=12",
]

[project.optional-dependencies]
browser = ["playwright>=1.46"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
imr-intruder = "imr_intruder.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imr_intruder = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
]
