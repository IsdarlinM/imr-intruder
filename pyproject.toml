[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-intruder"
version = "1.0.0"
description = "Professional multimode HTTP request matrix for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "imr" }]
keywords = ["http", "security-testing", "request-replay", "intruder", "bug-bounty"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "requests>=2.31,<3",
  "rich>=13.7,<15",
  "uvicorn>=0.30,<1",
]

[project.scripts]
imr-intruder = "imr_intruder.cli:main"

[project.urls]
Repository = "https://github.com/IsdarlinM/imr-intruder"
Issues = "https://github.com/IsdarlinM/imr-intruder/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imr_intruder = ["templates/*.html", "static/*.css", "static/*.js"]
